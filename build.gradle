plugins {
    id 'groovy'
}

group 'Byndyusoft.com'
version '1.0.9'

repositories {
    mavenCentral()
    maven {
        url "https://repo.jenkins-ci.org/releases/"
    }
}

sourceSets {
    main {
        groovy {
            srcDirs = ['src', 'vars']
        }
    }

    test {
        groovy {
            srcDirs = ['test']
        }
    }
}


dependencies {
    implementation("org.codehaus.groovy:groovy-all:2.4.21")
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.register(
    'testPipelineParameters',
    JavaExec
) {
    group = 'verification'
    description = 'Checks pipeline parameter forms and stage selection without Jenkins.'
    classpath = configurations.runtimeClasspath
    mainClass = 'groovy.ui.GroovyMain'
    args 'test/PipelineParametersTest.groovy'

    if (project.hasProperty('verboseTests')) {
        args '--verbose'
    }
}

tasks.named('check') {
    dependsOn tasks.named('testPipelineParameters')
}
